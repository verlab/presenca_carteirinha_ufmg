; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32p4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-p4-evboard
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_model.csv
extra_scripts = 
	pre:tools/build/version_flags.py
	pre:tools/build/pack_models.py
build_type = release
build_flags = 
	-D BOARD_HAS_PSRAM
	-D LV_CONF_INCLUDE_SIMPLE
	-I include
	-Os
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
	-D CORE_DEBUG_LEVEL=3
	-I lib/esp-dl/dl
	-I lib/esp-dl/dl/tool/include
	-I lib/esp-dl/dl/tensor/include
	-I lib/esp-dl/dl/base
	-I lib/esp-dl/dl/base/isa
	-I lib/esp-dl/dl/base/isa/esp32p4
	-I lib/esp-dl/dl/math/include
	-I lib/esp-dl/dl/model/include
	-I lib/esp-dl/dl/module/include
	-I lib/esp-dl/fbs_loader/include
	-I lib/esp-dl/vision/detect
	-I lib/esp-dl/vision/image
	-I lib/esp-dl/vision/image/isa
	-I lib/esp-dl/vision/recognition
	-I lib/esp-dl/vision/classification
	-I lib/human_face_detect
	-L lib/esp-dl/fbs_loader/lib/esp32p4
	-lfbs_model
	-D CONFIG_PIX_CVT_RGB565_TO_RGB565_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB565_TO_RGB888_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB565_TO_GRAY_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB565_TO_HSV_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB888_TO_RGB888_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB888_TO_RGB565_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB888_TO_GRAY_SUPPORT=1
	-D CONFIG_PIX_CVT_RGB888_TO_HSV_SUPPORT=1
	-D CONFIG_PIX_CVT_GRAY_TO_GRAY_SUPPORT=1
	-D CONFIG_PIX_CVT_HSV_TO_HSV_MASK_SUPPORT=1
	-D CONFIG_PIX_CVT_YUV_TO_RGB888_SUPPORT=1
	-D CONFIG_PIX_CVT_YUV_TO_RGB565_SUPPORT=1
	-D CONFIG_PIX_CVT_YUV_TO_GRAY_SUPPORT=1
	-D CONFIG_PIX_CVT_YUV_TO_HSV_SUPPORT=1
	-D CONFIG_PIX_CVT_YUV_TO_YUV_SUPPORT=1
	-D CONFIG_FLASH_HUMAN_FACE_DETECT_MSRMNP_S8_V1=1
	-D CONFIG_HUMAN_FACE_DETECT_MSRMNP_S8_V1=1
	-D CONFIG_DEFAULT_HUMAN_FACE_DETECT_MODEL=0
	-D CONFIG_HUMAN_FACE_DETECT_MODEL_IN_FLASH_PARTITION=1
	-D CONFIG_HUMAN_FACE_DETECT_MODEL_LOCATION=1
	-D CONFIG_HUMAN_FACE_DETECT_MODEL_SDCARD_DIR=\"models\"
	-D USE_FACE_DETECT
build_unflags = 
	-Og
	-g
lib_deps = 
	lvgl/lvgl@9.5.0
	adafruit/Adafruit PN532@^1.3.4
	bblanchon/ArduinoJson@^7.2.0
	adafruit/RTClib@^2.1.4
lib_ignore = hw_mocks
test_filter = embedded/*

[env:native]
platform = native
test_framework = unity
test_filter = native/*
test_build_src = yes
build_type = debug
build_flags = 
	-std=gnu++17
	-pthread
	-D NATIVE_TEST
build_src_filter = 
	-<*>
	+<app/>
	+<services/device_secret.cpp>
	+<services/config_service.cpp>
	+<services/roster_service.cpp>
	+<services/import_service.cpp>
	+<services/rfid_service.cpp>
	+<services/export_service.cpp>
	+<storage/atomic_file.cpp>
	+<storage/sd_card.cpp>
	+<storage/sd_tree.cpp>
	+<storage/photo_store.cpp>
	+<storage/attendance_store.cpp>
	+<storage/backup_store.cpp>
	+<storage/battery_log.cpp>
	+<storage/checkin_store.cpp>
	+<storage/device_prefs_store.cpp>
lib_deps = 
	bblanchon/ArduinoJson@^7.2.0
	adafruit/RTClib@^2.1.4